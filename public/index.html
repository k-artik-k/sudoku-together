<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#d4c5a9">
<script>document.documentElement.dataset.theme=localStorage.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")</script>
<title>Sudoku Together</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23f5efe0'/%3E%3Cline x1='21.3' y1='4' x2='21.3' y2='60' stroke='%23bfae8e' stroke-width='1.5'/%3E%3Cline x1='42.7' y1='4' x2='42.7' y2='60' stroke='%23bfae8e' stroke-width='1.5'/%3E%3Cline x1='4' y1='21.3' x2='60' y2='21.3' stroke='%23bfae8e' stroke-width='1.5'/%3E%3Cline x1='4' y1='42.7' x2='60' y2='42.7' stroke='%23bfae8e' stroke-width='1.5'/%3E%3Ctext x='12' y='18' font-family='Georgia,serif' font-size='14' fill='%234a3f2f'%3E9%3C/text%3E%3Ctext x='33' y='38' font-family='Georgia,serif' font-size='14' fill='%234a3f2f'%3E5%3C/text%3E%3Ctext x='46' y='58' font-family='Georgia,serif' font-size='14' fill='%234a3f2f'%3E1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Lora:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bs:min(100vw - 20px,480px);
  --paper:#f5efe0;--paper2:#ede5d0;--ink:#3a3225;--ink2:#6b5e4a;
  --ln:#c9b998;--ln2:#8a7a5a;--ac:#6b8c42;--ac2:#557030;
  --peer:rgba(107,140,66,.12);--same:rgba(107,140,66,.22);--sel:rgba(107,140,66,.32);
  --bad:#c44;--badbg:rgba(204,68,68,.1);
  --pencil:#4a3f2f;--pencil2:#6b5e4a;
  --shadow:0 2px 12px rgba(58,50,37,.12);
  --radius:10px;--on-ac:#fff;color-scheme:light;
  --font-sel-filled:'Lora',Georgia,serif;
}
[data-theme=dark]{
  --paper:#1f1b15;--paper2:#2a251c;--ink:#ece3d0;--ink2:#a89c84;
  --ln:#4a4233;--ln2:#9c8c6a;--ac:#8fb05a;--ac2:#a8c874;
  --peer:rgba(143,176,90,.12);--same:rgba(143,176,90,.22);--sel:rgba(143,176,90,.32);
  --bad:#ef7a7a;--badbg:rgba(239,122,122,.14);
  --pencil:#e3d9c3;--pencil2:#a89c84;
  --shadow:0 2px 12px rgba(0,0,0,.45);
  --on-ac:#1b1a12;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  font:16px/1.5 'Source Sans 3','Source Sans Pro',system-ui,sans-serif;
  color:var(--ink);
  touch-action:manipulation;user-select:none;-webkit-user-select:none;
  background-color:var(--paper);
  background-image:
    url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)' opacity='.06'/%3E%3C/svg%3E");
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  box-sizing:border-box;
}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{
  border:0;border-radius:var(--radius);
  background:var(--paper2);padding:10px 14px;
  cursor:pointer;box-shadow:var(--shadow);
  font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;
  font-weight:600;
  transition:transform .1s,box-shadow .1s;
}
button:active{transform:scale(.97)}
button.pri,.seg .on{background:var(--ac);color:var(--on-ac);font-weight:700}
input,select{padding:11px 14px;border-radius:var(--radius);border:1.5px solid var(--ln);background:var(--paper2);width:100%;user-select:text}
input:focus,select:focus{outline:none;border-color:var(--ac)}

.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:40px;height:40px;flex-shrink:0}
.logo-text{font-family:'Lora',Georgia,serif;font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.02em}

.card{
  max-width:400px;margin:auto;padding:24px;
  background:var(--paper2);border-radius:14px;
  display:grid;gap:14px;
  box-shadow:var(--shadow);
  border:1px solid var(--ln);
}
.card p,.card label{margin:0;color:var(--ink2);font-size:13px;font-weight:600}
.row{display:flex;gap:8px}
.seg{display:flex;gap:6px}
.seg button{flex:1;box-shadow:none;border:1.5px solid var(--ln);font-size:14px}
.seg .on{border-color:var(--ac)}
.or-divider{text-align:center;color:var(--ink2);font-size:13px;font-style:italic;position:relative}
.or-divider::before,.or-divider::after{content:'';position:absolute;top:50%;width:35%;height:1px;background:var(--ln)}
.or-divider::before{left:0}.or-divider::after{right:0}

#g{width:var(--bs);margin:auto;display:grid;gap:10px;padding:12px 0}
#top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.code-box{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink2);margin-right:auto}
.code-box b{font-family:'Lora',Georgia,serif;letter-spacing:.14em;font-size:16px;color:var(--ink);background:var(--paper2);padding:2px 8px;border-radius:6px;border:1.5px solid var(--ln)}
#top span{color:var(--ink2);font-size:14px;font-variant-numeric:tabular-nums}
#top button{font-size:13px;padding:7px 12px}

#pl{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:99px;
  background:var(--paper2);font-size:13px;font-weight:600;
  border:1px solid var(--ln);
}
.chip i{width:10px;height:10px;border-radius:50%}
.chip.off{opacity:.4}

#board{
  display:grid;grid-template:repeat(9,1fr)/repeat(9,1fr);
  width:var(--bs);height:var(--bs);
  border:2.5px solid var(--ln2);border-radius:var(--radius);
  overflow:hidden;
  background:var(--paper2);
  background-image:
    url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.5' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
  box-shadow:var(--shadow);
}
.c{
  display:flex;align-items:center;justify-content:center;
  font-family:'Architects Daughter','Segoe Print',cursive;
  font-size:calc(var(--bs)/9*.58);
  border:0 solid var(--ln);border-width:0 1px 1px 0;
  cursor:pointer;min-width:0;
  transition:background .15s;
  position:relative;
}
.c.r{border-right:2.5px solid var(--ln2)}
.c.b{border-bottom:2.5px solid var(--ln2)}
.c:nth-child(9n){border-right:0}
.c:nth-child(n+73){border-bottom:0}
.c.g{font-family:'Lora',Georgia,serif;font-size:calc(var(--bs)/9*.52);font-weight:700;color:var(--pencil)}
.c.pe{background:var(--peer)}.c.sm{background:var(--same)}.c.sel{background:var(--sel)}
.c.sel-filled{font-family:var(--font-sel-filled,'Lora',Georgia,serif);font-size:calc(var(--bs)/9*.52);font-weight:700}
.c.bad{color:var(--bad)!important;background:var(--badbg)}
.n{
  display:grid;grid:repeat(3,1fr)/repeat(3,1fr);
  width:100%;height:100%;
  font-family:'Architects Daughter','Segoe Print',cursive;
  font-size:calc(var(--bs)/9*.23);
  color:var(--pencil2);font-weight:400;
  text-align:center;align-items:center;
}

@keyframes solvedPop{
  0%{transform:scale(1);background:transparent}
  40%{transform:scale(1.08);background:rgba(107,140,66,.18)}
  100%{transform:scale(1);background:transparent}
}
@keyframes solvedShine{
  0%{box-shadow:inset 0 0 0 0 rgba(107,140,66,0)}
  50%{box-shadow:inset 0 0 12px 2px rgba(107,140,66,.25)}
  100%{box-shadow:inset 0 0 0 0 rgba(107,140,66,0)}
}
.c.solved-anim{animation:solvedPop .45s ease-out,solvedShine .6s ease-out}

@keyframes celebrateBoard{
  0%{box-shadow:0 2px 12px rgba(58,50,37,.12)}
  50%{box-shadow:0 0 30px 8px rgba(107,140,66,.3)}
  100%{box-shadow:0 2px 12px rgba(58,50,37,.12)}
}
#board.celebrate{animation:celebrateBoard 1.2s ease-in-out}

#tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#tools button{font-size:14px}
#tools .on{background:var(--ac);color:var(--on-ac)}
#pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
#pad button{
  height:calc(var(--bs)/9*1.25);padding:0;
  font-family:'Architects Daughter','Segoe Print',cursive;
  font-size:calc(var(--bs)/9*.62);
  color:inherit;
  border:1.5px solid var(--ln);
  box-shadow:none;
}
#pad button:hover{background:var(--sel)}
#pad button.x{visibility:hidden}
#hi{position:relative}
#hi .hint-count{
  font-size:11px;font-weight:700;
  background:var(--ac);color:var(--on-ac);
  border-radius:99px;padding:1px 5px;
  margin-left:4px;
}
#hi.no-hints{opacity:.45;pointer-events:none}

#done{
  padding:16px;border-radius:14px;
  background:var(--paper);color:var(--ink);
  border:2px solid var(--ln);
  box-shadow:var(--shadow);
  display:grid;gap:12px;
}
#done[hidden]{display:none!important}

/* Voice Chat */
#vc-wrap{display:flex;gap:4px;align-items:center}
.vc-btn{
  font-size:12px;padding:5px 9px;border-radius:var(--radius);
  background:var(--paper2);border:1px solid var(--ln);
  display:inline-flex;align-items:center;gap:3px;
}
.vc-btn.in-voice{background:#2e7d32;color:#fff;border-color:#2e7d32}
.vc-btn.vc-danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.chip-err{margin-left:4px;font-size:11px;opacity:.85}
.chip-vc{margin-left:2px;font-size:12px}
.chip.speaking{
  box-shadow:0 0 0 2.5px #4caf50, 0 0 8px rgba(76,175,80,.6);
  animation:speakingPulse .9s infinite alternate;
}
@keyframes speakingPulse{
  0%{box-shadow:0 0 0 2px #4caf50}
  100%{box-shadow:0 0 0 4px #4caf50, 0 0 10px rgba(76,175,80,.8)}
}

/* Spectator & Elimination */
.spectator-banner{
  background:var(--badbg);border:1.5px solid var(--bad);color:var(--bad);
  padding:8px 12px;border-radius:var(--radius);font-size:13px;font-weight:600;
  text-align:center;
}
.disabled-elim{opacity:.35!important;pointer-events:none!important;cursor:not-allowed!important}
.elim-tag{color:var(--bad);font-weight:700}

/* Match Review Modal */
.review-modal{
  position:fixed;inset:0;background:rgba(58,50,37,.55);
  display:flex;align-items:center;justify-content:center;
  z-index:999;padding:16px;
}
.review-card{
  background:var(--paper2);border:1.5px solid var(--ln2);border-radius:14px;
  padding:20px 22px;max-width:540px;width:100%;max-height:92vh;overflow-y:auto;
  box-shadow:0 4px 32px rgba(58,50,37,.22);display:grid;gap:14px;
}
.review-header{text-align:center;display:grid;gap:4px}
.review-badge{
  display:inline-block;padding:5px 14px;border-radius:99px;
  background:var(--ac);color:var(--on-ac);font-size:12px;font-weight:700;
  letter-spacing:.04em;margin:0 auto;
}
.review-header h2{margin:0;font-family:'Lora',Georgia,serif;font-size:22px;font-weight:700;color:var(--ink)}
.review-meta{font-size:13px;color:var(--ink2)}

.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);margin-bottom:2px}
.contrib-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--paper);border:1px solid var(--ln)}
.contrib-bar>div{height:100%;transition:width .4s}

.review-rows{display:grid;gap:4px}
.review-row{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  border-radius:8px;font-size:13px;
}
.review-row:nth-child(odd){background:rgba(58,50,37,.05)}
.review-row-rank{font-weight:700;min-width:46px;font-size:13px}
.review-row-name{display:flex;align-items:center;gap:5px;flex:1;font-weight:600}
.review-row-stat{color:var(--ink2);font-size:12px;min-width:48px;text-align:right}
.review-row-score{font-weight:700;font-size:14px;min-width:52px;text-align:right}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
.badge-win{background:var(--ac);color:var(--on-ac);font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px}
.badge-out{background:var(--badbg);color:var(--bad);font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px}
.tag-you{font-size:11px;font-weight:600;opacity:.7}
.score-formula-hint{font-size:11px;color:var(--ink2);font-style:italic}

.review-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.review-btn{flex:1;font-size:14px;padding:9px 14px}
.review-select{width:auto;flex:1;font-size:14px;padding:9px 12px}

#off{position:fixed;top:0;left:0;right:0;background:#d4a017;color:#3a3225;text-align:center;padding:6px;font-size:14px;font-weight:600;z-index:99}

.bot-row select{font-size:14px;max-width:140px}
.bot-row button{font-size:14px}

@media(min-width:860px){
  :root{--bs:min(100vh - 120px,560px,100vw - 400px)}
  #g{width:auto;grid-template-columns:var(--bs) 340px;justify-content:center;gap:10px 28px;align-content:start;margin:auto;padding:16px 0}
  #g>:not(#board){grid-column:2}
  #board{grid-column:1;grid-row:1/8}
  #pad{grid-template-columns:repeat(3,1fr)}
  #pad button{height:60px;font-size:36px}
}
.th{display:grid;place-items:center;padding:8px 10px}
.th svg{width:18px;height:18px}
#top .th{padding:7px 9px}
.logo .th{margin-left:auto}
select option{background:var(--paper2);color:var(--ink)}
</style></head><body>
<div id="off" hidden>Reconnecting…</div>

<div id="lobby" class="card">
  <div class="logo">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="64" height="64" rx="10" fill="#f5efe0" stroke="#bfae8e" stroke-width="1.5"/>
      <line x1="21.3" y1="6" x2="21.3" y2="58" stroke="#8a7a5a" stroke-width="1.2"/>
      <line x1="42.7" y1="6" x2="42.7" y2="58" stroke="#8a7a5a" stroke-width="1.2"/>
      <line x1="6" y1="21.3" x2="58" y2="21.3" stroke="#8a7a5a" stroke-width="1.2"/>
      <line x1="6" y1="42.7" x2="58" y2="42.7" stroke="#8a7a5a" stroke-width="1.2"/>
      <text x="10" y="18" font-family="Georgia,serif" font-size="13" fill="#4a3f2f">9</text>
      <text x="32" y="38" font-family="Georgia,serif" font-size="13" fill="#4a3f2f">5</text>
      <text x="46" y="56" font-family="Georgia,serif" font-size="13" fill="#4a3f2f">1</text>
    </svg>
    <span class="logo-text">Sudoku Together</span>
    <button class="th" aria-label="Toggle dark mode"></button>
  </div>
  <label>Name</label>
  <div class="row"><input id="name" maxlength="18" placeholder="Pick a name"><button id="dice" style="width:80px">↺</button></div>
  <label>Players</label><div class="seg" id="mx" data-v="4"><button data-v="2">2</button><button data-v="3">3</button><button data-v="4" class="on">4</button></div>
  <label>Difficulty</label><div class="seg" id="df" data-v="easy"><button data-v="easy" class="on">Easy</button><button data-v="medium">Med</button><button data-v="hard">Hard</button><button data-v="expert">Expert</button></div>
  <button class="pri" id="create">Create Room</button>
  <div class="or-divider">or join</div>
  <div class="row"><input id="jc" maxlength="4" placeholder="Room code" style="text-transform:uppercase"><button id="join" class="pri" style="width:80px">Join</button></div>
</div>

<div id="g" hidden>
  <div id="top">
    <div class="code-box"><span class="code-lbl">Room Code:</span> <b id="code"></b></div>
    <span id="tm">0:00</span>
    <span id="diff"></span>
    <span id="err"></span>
    <div id="vc-wrap">
      <button id="vc-btn" class="vc-btn" title="Join Voice Chat">Voice</button>
      <button id="vc-mute" class="vc-btn" hidden title="Mute/Unmute">Mute</button>
      <button id="vc-leave" class="vc-btn vc-danger" hidden title="Leave Voice">Disconnect</button>
    </div>
    <button id="review-reopen-btn" style="font-size:13px;padding:7px 12px" hidden>Review</button>
    <button class="th" aria-label="Toggle dark mode"></button>
    <button id="inv">Invite</button>
    <button id="leave">Leave</button>
  </div>
  <div id="pl"></div>
  <div id="spectator-msg" class="spectator-banner" hidden>You made 5 mistakes and are now spectating. Watch your teammates finish!</div>
  <div id="board"></div>
  <div id="done" hidden></div>
  <div id="tools"><button id="er">Erase</button><button id="nt">Notes</button><button id="hi">Hint <span class="hint-count">5</span></button></div>
  <div id="pad"></div>
  <div class="row bot-row"><button id="nw">New puzzle</button></div>
</div>

<div id="audio-sink" hidden></div>

<div id="review-modal" class="review-modal" hidden>
  <div id="review-modal-card" class="review-card">
    <div class="review-header">
      <span id="review-badge" class="review-badge">Puzzle Solved</span>
      <h2 id="review-title">Match Review</h2>
      <div id="review-meta" class="review-meta"></div>
    </div>

    <div id="contrib-section" hidden>
      <div class="section-label">Cell contributions</div>
      <div id="contrib-bar" class="contrib-bar"></div>
    </div>

    <div>
      <div class="section-label" style="margin-bottom:6px">Scores</div>
      <div id="review-rows" class="review-rows"></div>
      <div class="score-formula-hint" style="margin-top:6px">+100 per cell · −40 per mistake · +200 winner bonus</div>
    </div>

    <div class="review-actions">
      <button id="review-inspect-btn" class="review-btn">View Board</button>
      <button id="review-new-btn" class="review-btn pri">Next Puzzle</button>
    </div>
  </div>
</div>

<script type="module">
import {generate} from './sudoku.js';
const $=s=>document.querySelector(s),PAL={light:['#6b8c42','#7c6bc4','#c47a3a','#3a8cc4'],dark:['#8fb05a','#a897f0','#e8a05c','#6fb4ec']};let COL;
const A='Swift Brave Cosmic Lucky Mellow Fuzzy Jolly Clever Nimble Quirky Sunny Mighty Witty Zesty'.split(' ');
const N='Panda Otter Falcon Tiger Koala Fox Llama Gecko Owl Moose Lynx Badger Heron Bison'.split(' ');
const pk=a=>a[Math.random()*a.length|0],gen=()=>pk(A)+pk(N)+(10+Math.random()*90|0);
const esc=s=>s.replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const fmt=ms=>{ms=Math.max(0,ms/1000|0);return (ms/60|0)+':'+String(ms%60).padStart(2,'0')};
const same=(a,b)=>a!=b&&(a%9==b%9||(a/9|0)==(b/9|0)||((a/27|0)==(b/27|0)&&(a%9/3|0)==(b%9/3|0)));
let ws,S=null,sel=-1,nm=false,you=-1,last=0,notes=Array(81).fill(0),sess=JSON.parse(localStorage.sess||'null');

// Voice Chat State
let localStream=null,inVoice=false,isMuted=false;
const peerConnections={},audioElements={},speakingPlayers=new Set();
let audioCtx=null,localAnalyser=null,localSpeaking=false;
const rtcConfig={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};

async function toggleVoice(){
  if(inVoice)leaveVoice();
  else await joinVoice();
}

async function joinVoice(){
  try{
    $('#vc-btn').textContent='⏳ Connecting…';
    localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    inVoice=true;isMuted=false;
    setupLocalAudioMeter(localStream);
    tx({t:'voice_state',inVoice:true,muted:false});
    updateVoiceUI();
    syncVoicePeers();
  }catch(err){
    console.error('Voice access error:',err);
    $('#vc-btn').textContent='Voice';
    alert('Microphone access is required for voice chat: '+(err.message||'Permission denied'));
    leaveVoice();
  }
}

function leaveVoice(){
  if(localStream){
    localStream.getTracks().forEach(t=>t.stop());
    localStream=null;
  }
  Object.keys(peerConnections).forEach(closePeer);
  if(audioCtx){try{audioCtx.close()}catch{}}
  audioCtx=null;localAnalyser=null;
  inVoice=false;isMuted=false;localSpeaking=false;
  speakingPlayers.clear();
  tx({t:'voice_state',inVoice:false,muted:false});
  updateVoiceUI();
  if(S)draw();
}

function syncVoicePeers(){
  if(!inVoice||!S||!sess)return;
  const myPlayer=S.players.find(p=>p.slot===you);
  if(!myPlayer)return;
  const voicePeers=S.players.filter(p=>p.on&&p.inVoice&&p.id!==myPlayer.id);
  for(const pid of Object.keys(peerConnections)){
    if(!voicePeers.some(p=>p.id===pid))closePeer(pid);
  }
  for(const peer of voicePeers){
    if(!peerConnections[peer.id]){
      if(myPlayer.slot<peer.slot)initiatePeer(peer.id);
    }
  }
}

function createPeerConnection(remoteId){
  const pc=new RTCPeerConnection(rtcConfig);
  peerConnections[remoteId]=pc;
  if(localStream){
    localStream.getTracks().forEach(track=>pc.addTrack(track,localStream));
  }
  pc.onicecandidate=e=>{
    if(e.candidate)tx({t:'signal',to:remoteId,signal:{type:'candidate',candidate:e.candidate}});
  };
  pc.ontrack=e=>{
    let audio=audioElements[remoteId];
    if(!audio){
      audio=document.createElement('audio');
      audio.autoplay=true;audio.playsInline=true;
      $('#audio-sink').appendChild(audio);
      audioElements[remoteId]=audio;
    }
    audio.srcObject=e.streams[0];
    setupRemoteAudioMeter(remoteId,e.streams[0]);
  };
  pc.onconnectionstatechange=()=>{
    if(pc.connectionState==='disconnected'||pc.connectionState==='failed'||pc.connectionState==='closed'){
      closePeer(remoteId);
    }
  };
  return pc;
}

async function initiatePeer(remoteId){
  const pc=createPeerConnection(remoteId);
  try{
    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    tx({t:'signal',to:remoteId,signal:{type:'offer',sdp:pc.localDescription}});
  }catch(err){console.error('Peer offer error',err)}
}

async function handleSignal(fromId,signal){
  if(!inVoice||!localStream)return;
  let pc=peerConnections[fromId];
  if(!pc)pc=createPeerConnection(fromId);
  if(signal.type==='offer'){
    await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
    const answer=await pc.createAnswer();
    await pc.setLocalDescription(answer);
    tx({t:'signal',to:fromId,signal:{type:'answer',sdp:pc.localDescription}});
  }else if(signal.type==='answer'){
    await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
  }else if(signal.type==='candidate'&&signal.candidate){
    try{await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));}catch(e){}
  }else if(signal.type==='hangup'){
    closePeer(fromId);
  }
}

function closePeer(remoteId){
  if(peerConnections[remoteId]){
    try{peerConnections[remoteId].close()}catch{}
    delete peerConnections[remoteId];
  }
  if(audioElements[remoteId]){
    try{audioElements[remoteId].remove()}catch{}
    delete audioElements[remoteId];
  }
  speakingPlayers.delete(remoteId);
}

function setupLocalAudioMeter(stream){
  try{
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    if(!AudioContextClass)return;
    if(!audioCtx)audioCtx=new AudioContextClass();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const source=audioCtx.createMediaStreamSource(stream);
    localAnalyser=audioCtx.createAnalyser();
    localAnalyser.fftSize=256;
    source.connect(localAnalyser);
    const data=new Uint8Array(localAnalyser.frequencyBinCount);
    function checkAudio(){
      if(!inVoice||!localAnalyser)return;
      localAnalyser.getByteFrequencyData(data);
      let sum=0;for(let i=0;i<data.length;i++)sum+=data[i];
      const avg=sum/data.length;
      const speaking=!isMuted&&avg>16;
      if(speaking!==localSpeaking){
        localSpeaking=speaking;
        const myChip=$(`#chip-${you}`);
        if(myChip)myChip.classList.toggle('speaking',localSpeaking);
      }
      requestAnimationFrame(checkAudio);
    }
    requestAnimationFrame(checkAudio);
  }catch(e){}
}

function setupRemoteAudioMeter(remoteId,stream){
  try{
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    if(!AudioContextClass)return;
    if(!audioCtx)audioCtx=new AudioContextClass();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const source=audioCtx.createMediaStreamSource(stream);
    const analyser=audioCtx.createAnalyser();
    analyser.fftSize=256;
    source.connect(analyser);
    const data=new Uint8Array(analyser.frequencyBinCount);
    function checkRemote(){
      if(!peerConnections[remoteId])return;
      analyser.getByteFrequencyData(data);
      let sum=0;for(let i=0;i<data.length;i++)sum+=data[i];
      const avg=sum/data.length;
      const speaking=avg>16;
      const peer=S&&S.players.find(p=>p.id===remoteId);
      if(peer){
        const chip=$(`#chip-${peer.slot}`);
        if(chip)chip.classList.toggle('speaking',speaking);
      }
      requestAnimationFrame(checkRemote);
    }
    requestAnimationFrame(checkRemote);
  }catch(e){}
}

function showReviewModal(){
  if(!S||!S.done)return;
  const stats=S.players.map(p=>{
    const filled=S.values.reduce((n,v,i)=>n+(v===S.solution[i]&&v!==S.puzzle[i]&&S.owners[i]===p.slot?1:0),0);
    const errors=p.errors||0;
    const attempts=filled+errors;
    const accuracy=attempts>0?Math.round((filled/attempts)*100):(filled>0?100:0);
    return {
      ...p,
      filled,
      errors,
      accuracy,
      color:COL[p.slot]
    };
  });
  
  const totalFilled=stats.reduce((sum,p)=>sum+p.filled,0);
  stats.forEach(p=>{
    p.sharePct=totalFilled>0?Math.round((p.filled/totalFilled)*100):0;
  });

  const maxFilled=Math.max(0,...stats.map(p=>p.filled));
  const winners=maxFilled>0?stats.filter(p=>p.filled===maxFilled):[];
  
  stats.forEach(p=>{
    const isWinner=winners.some(w=>w.slot===p.slot);
    p.isWinner=isWinner;
    p.score=Math.max(0,(p.filled*100)-(p.errors*40)+(isWinner?200:0));
  });
  
  stats.sort((a,b)=>b.filled-a.filled||b.score-a.score||a.errors-b.errors);
  
  const isSolved=S.endReason==='solved';
  $('#review-badge').textContent=isSolved?'Puzzle Solved':'Match Over';
  $('#review-badge').style.background=isSolved?'var(--ac)':'var(--bad)';

  $('#review-meta').textContent=`Time: ${fmt((S.done||Date.now())-S.t0)} · Difficulty: ${S.diff}`;
  
  if(totalFilled>0){
    $('#contrib-bar').innerHTML=stats.filter(p=>p.filled>0).map(p=>
      `<div style="width:${p.sharePct}%;background:${p.color};" title="${esc(p.name)}: ${p.filled} cells (${p.sharePct}%)"></div>`
    ).join('');
    $('#contrib-section').hidden=false;
  }else{
    $('#contrib-section').hidden=true;
  }
  
  $('#review-rows').innerHTML=stats.map((p,idx)=>{
    const rankLabel=['1st','2nd','3rd','4th'][idx]||`${idx+1}th`;
    const isMe=p.slot===you;
    const statusTag=p.isWinner&&maxFilled>0?'<span class="badge-win">Winner</span>':(p.errors>=5?'<span class="badge-out">Out</span>':'');
    return `<div class="review-row">`+
      `<span class="review-row-rank">${rankLabel}</span>`+
      `<span class="review-row-name"><i class="dot" style="background:${p.color}"></i><b>${esc(p.name)}</b>${isMe?` <span class="tag-you">(you)</span>`:''} ${statusTag}</span>`+
      `<span class="review-row-stat">${p.filled} cells · ${p.errors} err</span>`+
      `<span class="review-row-score">${p.score.toLocaleString()} pts</span>`+
    `</div>`;
  }).join('');
  
  $('#review-modal').hidden=false;
  $('#review-reopen-btn').hidden=false;
}

$('#dice').onclick=()=>$('#name').value=gen();
const nameV=()=>{const n=$('#name').value.trim()||gen();$('#name').value=n;localStorage.nm=n;return n};
$('#create').onclick=()=>{const d=$('#df').dataset.v;lastCreate={t:'create',name:nameV(),max:+$('#mx').dataset.v,diff:d,puzzle:generate(d).puzzle};start(newCode(),lastCreate)};
$('#join').onclick=()=>{const c=$('#jc').value.trim().toUpperCase();if(!/^[A-Z]{4}$/.test(c))return alert('Enter the 4-letter room code');start(c,{t:'join',name:nameV(),code:c,pid:sess&&sess.code==c?sess.pid:undefined})};
</script></body></html>
